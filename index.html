<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Millennium Robotics Lab // 千禧年机器人部</title>
<meta name="description" content="Millennium Robotics Lab — AI-made memes about AI. YouTube, Bilibili and X.">
<meta name="theme-color" content="#05080f">
<meta property="og:title" content="Millennium Robotics Lab // 千禧年机器人部">
<meta property="og:description" content="AI-made memes about AI.">

<style>
:root{
  --bg:#05080f; --bg2:#0a1220; --panel:#08101c;
  --accent:#40d8ff; --accent-dim:#1a6a86; --white:#eef8ff; --muted:#8fb3c7;
  --px:"Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --dot:"DotGothic16", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:var(--bg)}
body{
  background:radial-gradient(900px 520px at 50% 0%, #0e2236 0%, transparent 65%), linear-gradient(var(--bg), var(--bg2));
  background-color:var(--bg2);
  color:var(--white); font-family:var(--dot); font-size:17px; line-height:1.6;
  min-height:100vh; min-height:100dvh;
  padding:24px 16px; -webkit-font-smoothing:none; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);mix-blend-mode:overlay}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}
:focus-visible{outline:3px dashed var(--accent);outline-offset:4px}

.page{min-height:100%;display:grid;place-items:center}
.wrap{width:100%;max-width:440px;padding:10px;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.frame{position:relative;background:var(--panel);border:4px solid var(--white);padding:40px 30px 36px;text-align:center;
  box-shadow:0 0 0 4px var(--bg), 0 0 0 8px var(--accent-dim), 0 0 28px 8px rgba(64,216,255,.16)}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;border:4px solid var(--accent);pointer-events:none}
.frame::before{top:-14px;left:-14px;border-right:0;border-bottom:0}
.frame::after{bottom:-14px;right:-14px;border-left:0;border-top:0}

h1{margin:0;font-family:var(--px);font-size:clamp(15px,4.4vw,19px);line-height:1.6;letter-spacing:1px}
h1 span{color:var(--accent)}
.sub{margin:8px 0 0;color:var(--muted);font-size:17px;letter-spacing:2px}

[hidden]{display:none!important}
.links{display:grid;gap:16px;margin:30px 0 0}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--bg);background:var(--accent);
  font-family:var(--px);font-size:13px;padding:17px 18px;
  box-shadow:inset -4px -4px 0 #1592b8, inset 4px 4px 0 #a8efff, 0 6px 0 #0b3a4a;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.btn:focus-visible{outline-offset:-7px;outline-color:var(--bg)}
.btn svg{width:20px;height:20px;flex:none}
.btn .arrow{margin-left:auto;font-size:10px}
.btn:hover{background:var(--white)}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 #1592b8, inset 4px 4px 0 #a8efff, 0 2px 0 #0b3a4a}


#hikari{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;opacity:0}
#hikari.on{animation:hikari 1.8s ease-out forwards}
#hikari::before{content:"";position:absolute;left:0;right:0;top:50%;height:22vh;transform:translateY(-50%) scaleY(0);
  background:linear-gradient(transparent, rgba(64,216,255,.55) 35%, #fff 50%, rgba(64,216,255,.55) 65%, transparent)}
#hikari.on::before{animation:beam 1.8s ease-out forwards}
#hikari span{position:relative;font-family:var(--px);font-size:clamp(22px,6vw,56px);color:var(--bg);background:var(--white);padding:16px 24px;box-shadow:0 0 0 6px var(--accent),0 0 60px 20px rgba(64,216,255,.6)}
@keyframes hikari{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes beam{0%{transform:translateY(-50%) scaleY(0)}15%{transform:translateY(-50%) scaleY(1)}100%{transform:translateY(-50%) scaleY(.6)}}

@media (max-width:420px){ .frame{padding:32px 20px 30px} .btn{font-size:clamp(10px,3vw,12px);gap:10px;padding-inline:12px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} #hikari.on{opacity:1} }
</style>
</head>
<body>
<div class="page">
<main class="wrap">
  <div class="frame">
    <h1 data-i18n="title" aria-label="MILLENNIUM ROBOTICS LAB">MILLENNIUM<br><span>ROBOTICS LAB</span></h1>
    <p lang="zh-CN" class="sub" data-i18n="subtitle">千禧年机器人部</p>

    <nav class="links" aria-label="Channels">
      <a class="btn" data-region="global" aria-label="YouTube (opens in a new tab)" href="https://www.youtube.com/@project-arisu" target="_blank" rel="noopener">
        <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="2" width="10" height="6" fill="currentColor"/><rect x="4" y="3" width="1" height="4" fill="#40d8ff"/><rect x="5" y="4" width="1" height="2" fill="#40d8ff"/></svg>
        YOUTUBE <span class="arrow" aria-hidden="true">▶</span></a>
      <a class="btn" data-region="china" hidden aria-label="Bilibili (opens in a new tab)" href="https://space.bilibili.com/1161124651" target="_blank" rel="noopener">
        <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="1" height="2" fill="currentColor"/><rect x="7" y="0" width="1" height="2" fill="currentColor"/><rect x="0" y="2" width="10" height="7" fill="currentColor"/><rect x="1" y="3" width="8" height="5" fill="#40d8ff"/><rect x="3" y="5" width="1" height="1" fill="currentColor"/><rect x="6" y="5" width="1" height="1" fill="currentColor"/></svg>
        BILIBILI <span class="arrow" aria-hidden="true">▶</span></a>
      <a class="btn" data-region="global" aria-label="X / Twitter (opens in a new tab)" href="https://x.com/projectarisu" target="_blank" rel="noopener">
        <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="2" height="2" fill="currentColor"/><rect x="2" y="2" width="2" height="2" fill="currentColor"/><rect x="4" y="4" width="2" height="2" fill="currentColor"/><rect x="6" y="6" width="2" height="2" fill="currentColor"/><rect x="8" y="8" width="2" height="2" fill="currentColor"/><rect x="8" y="0" width="2" height="2" fill="currentColor"/><rect x="6" y="2" width="1" height="1" fill="currentColor"/><rect x="3" y="6" width="1" height="1" fill="currentColor"/><rect x="0" y="8" width="2" height="2" fill="currentColor"/></svg>
        X / TWITTER <span class="arrow" aria-hidden="true">▶</span></a>
      <a class="btn" aria-label="GitHub organization (opens in a new tab)" href="https://github.com/Millennium-Robotics-Lab" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.49c-2.23.48-2.7-1.08-2.7-1.08-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.71 1.21 1.87.86 2.33.66.07-.52.28-.86.51-1.06-1.78-.2-3.64-.89-3.64-3.96 0-.88.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82A7.65 7.65 0 0 1 8 3.72c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.08-1.87 3.75-3.65 3.95.29.25.54.74.54 1.49v2.33c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GITHUB <span class="arrow" aria-hidden="true">▶</span></a>
    </nav>
  </div>
</main>
</div>

<div id="hikari" role="status" aria-live="polite" aria-atomic="true"><span></span></div>

<script>
/* GitHub Pages has no server-side country headers. Use an IP-based country
   lookup, retaining global links if the service fails or times out. */
function showRegion(region) {
  document.querySelectorAll("[data-region]").forEach(link => {
    link.hidden = link.dataset.region !== region;
  });
}
async function detectRegion() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3000);
  try {
    const response = await fetch("https://get.geojs.io/v1/ip/country.json", {
      signal: controller.signal, credentials: "omit", referrerPolicy: "no-referrer"
    });
    if (!response.ok) return;
    const country = await response.json();
    showRegion(country.country === "CN" ? "china" : "global");
  } catch { /* Keep global links if the country service is unreachable. */ }
  finally { clearTimeout(timeout); }
}
detectRegion();

/* Text by language. Add "zh" / "ja" objects later; keys match data-i18n. */
const COPY = { en: {} /* zh: { subtitle: "…" }, ja: { … } */ };
const T = COPY[document.documentElement.dataset.lang] || COPY.en;
document.querySelectorAll("[data-i18n]").forEach(el => { const v = T[el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });

/* Easter egg: type "hikari" anywhere */
const hk = document.getElementById("hikari"); let buf = ""; let hikariTimer;
function hikari(){ clearTimeout(hikariTimer); hk.classList.remove("on"); hk.querySelector("span").textContent = "Hikari yo!"; void hk.offsetWidth; hk.classList.add("on"); hikariTimer = setTimeout(() => { hk.classList.remove("on"); hk.querySelector("span").textContent = ""; }, 1900); }
window.addEventListener("keydown", e => { if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return; buf = (buf + e.key.toLowerCase()).slice(-6); if (buf === "hikari") hikari(); });
</script>
